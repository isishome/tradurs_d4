<!DOCTYPE html>
<html class="notranslate" translate="no" dir="ltr">
  <head>
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta name="google" content="notranslate" />
    <link rel="preconnect" href="<%= new URL(process.env.VITE_APP_BACKEND || 'https://api.tradurs.com').origin %>" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <% if (ctx.prod) { %>
    <% /* Google Analytics는 쿠키 동의(분석) 후에만 src/common/consent.ts가 넣는다. AdSense는 동의와 무관(2026-10-20 결정). */ %>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5110777286519562"
      crossorigin="anonymous"
      onload="window.adsenseLoaded = true; window.dispatchEvent(new Event('adsense-loaded'))"
    ></script>
    <% } %>
  </head>

  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
